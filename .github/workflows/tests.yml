name: "tests"

# Called by ci.yml. The Mac agent's logic is tested on both: its macOS-only
# lookups (lsappinfo, /dev/ttysNNN) are runtime checks, and the macOS run
# exercises the real tty, socket and lock behaviour there.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: "tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14

    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --locked
