[package]
name = "herdr-warp"
version = "0.1.0"
edition = "2024"
description = "herdr agent notifications on the Mac via Warp, and herdr tab titles from agent terminal titles"
license = "MIT"
repository = "https://github.com/gurinderu/herdr-warp"
publish = false

[dependencies]
libc = "0.2.191"
serde = "1.0.229"
serde_json = "1.0.154"
unicode-normalization = "0.1.26"

[profile.release]
strip = true
